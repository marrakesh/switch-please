name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

  # SignPath reads the job's details to confirm that what it is asked to sign was built by
  # this workflow and not merely uploaded by someone holding the API token.
  actions: read

jobs:
  release:
    runs-on: windows-latest

    # Signing happens only once SignPath has been set up for the repository, which is
    # recorded as a repository variable. Until then every step below that mentions it is
    # skipped and the release is built exactly as before, unsigned. docs/code-signing.md
    # says what has to exist on the SignPath side.
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --configuration Release

      # Four builds, because neither the runtime question nor the architecture one has a
      # single right answer. The self-contained ones need nothing installed but carry the
      # whole runtime; compression takes each from about 116 MB to about 52 MB, which is the
      # difference between a plausible download and an unreasonable one.
      - name: Publish
        shell: pwsh
        run: |
          foreach ($architecture in 'x64', 'arm64') {
            dotnet publish src/SwitchPlease.App `
              --configuration Release `
              --runtime "win-$architecture" `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              --output "publish/standalone-$architecture"

            # For anyone who already has the .NET Desktop Runtime: 0.4 MB instead of 52.
            dotnet publish src/SwitchPlease.App `
              --configuration Release `
              --runtime "win-$architecture" `
              --self-contained false `
              -p:PublishSingleFile=true `
              --output "publish/framework-dependent-$architecture"
          }

      # x64 keeps the plain names it has always had, so existing links and any script that
      # downloads the latest release do not break.
      - name: Name the executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          Copy-Item publish/standalone-x64/SwitchPlease.exe artifacts/SwitchPlease.exe
          Copy-Item publish/framework-dependent-x64/SwitchPlease.exe artifacts/SwitchPlease-runtime-required.exe
          Copy-Item publish/standalone-arm64/SwitchPlease.exe artifacts/SwitchPlease-arm64.exe
          Copy-Item publish/framework-dependent-arm64/SwitchPlease.exe artifacts/SwitchPlease-arm64-runtime-required.exe

      # Signed in two rounds, because the installer has to carry the signed executable inside
      # it: a signed installer that unpacks an unsigned program would leave SmartScreen and
      # every antivirus scanner looking at exactly the file that installs a keyboard hook.
      # Each round is one signing request, which SignPath Foundation approves by hand.
      - name: Upload the executables for signing
        if: env.SIGN == 'true'
        id: unsigned-executables
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executables
          path: artifacts/*.exe

      - name: Sign the executables
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: switch-please
          signing-policy-slug: release-signing
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned-executables.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-executables

      - name: Use the signed executables
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-executables/*.exe artifacts/ -Force

      # Not guaranteed to be on the runner image, and reinstalling it when it is already
      # there costs half a minute on every release for nothing.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # Wraps the self-contained build, so the installed copy needs no runtime either. It
      # installs per user and asks for no elevation, which is not only politeness: Switch
      # Please must not run elevated, because SendInput from a higher integrity level cannot
      # reach an ordinary window.
      #
      # Built from artifacts/, which holds the signed executables when signing is set up.
      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $sources = @{ 'x64' = 'SwitchPlease.exe'; 'arm64' = 'SwitchPlease-arm64.exe' }

          foreach ($architecture in 'x64', 'arm64') {
            & $iscc /Qp `
              "/DAppVersion=$version" `
              "/DArch=$architecture" `
              "/DSourceExe=..\artifacts\$($sources[$architecture])" `
              installer\SwitchPlease.iss

            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $architecture" }
          }

      - name: Name the installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null

          Copy-Item installer-output/SwitchPlease-Setup-x64.exe installers/SwitchPlease-Setup.exe
          Copy-Item installer-output/SwitchPlease-Setup-arm64.exe installers/SwitchPlease-Setup-arm64.exe

      - name: Upload the installers for signing
        if: env.SIGN == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: installers/*.exe

      - name: Sign the installers
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: switch-please
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: Use the signed installers
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-installers/*.exe installers/ -Force

      - name: Collect the installers
        shell: pwsh
        run: Copy-Item installers/*.exe artifacts/

      # Published whether or not the files are signed. A signature says who built the file;
      # a checksum published by the same run that built it lets anyone verify they downloaded
      # what was built rather than what someone reuploaded, and covers the releases from
      # before signing was set up.
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

          Get-Content artifacts/SHA256SUMS.txt

      # winget is where most people would rather get a tray utility than from a browser
      # download that SmartScreen argues with. Submitting to the community repository is a
      # pull request against microsoft/winget-pkgs and stays a deliberate, manual act; what
      # is automated here is the tedious half, which is filling in the version, the URLs and
      # the hashes of the files this run actually produced.
      #
      # It offers the installer rather than the portable executable, so winget users get an
      # entry in Apps & features and an uninstall that works. Two fields follow from how the
      # installer is built and would be wrong if either changed: Scope is user because the
      # installer asks for no elevation, and ProductCode is the AppId from
      # installer/SwitchPlease.iss with Inno's _is1 suffix, which is the uninstall key it
      # registers. Without them winget cannot tell whether the package is already installed.
      - name: Generate winget manifests
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $manifests = 'artifacts/winget'
          New-Item -ItemType Directory -Force -Path $manifests | Out-Null

          function Hash($name) { (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash }

          @"
          PackageIdentifier: Marrakesh.SwitchPlease
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ | Set-Content "$manifests/Marrakesh.SwitchPlease.yaml" -Encoding utf8

          @"
          PackageIdentifier: Marrakesh.SwitchPlease
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: Oleksii Ozerov
          PublisherUrl: https://github.com/marrakesh
          PackageName: Switch Please
          PackageUrl: https://github.com/${{ github.repository }}
          License: MIT
          LicenseUrl: https://github.com/${{ github.repository }}/blob/main/LICENSE
          ShortDescription: Fixes text typed in the wrong keyboard layout.
          Description: >-
            A keyboard layout switcher for Windows. Fixes text typed before you noticed the
            layout was wrong, by hotkey or automatically. Works with any pair of installed
            layouts, uses the Windows spell-check dictionaries, and makes no network requests.
          Tags:
          - keyboard
          - layout
          - russian
          - ukrainian
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ | Set-Content "$manifests/Marrakesh.SwitchPlease.locale.en-US.yaml" -Encoding utf8

          @"
          PackageIdentifier: Marrakesh.SwitchPlease
          PackageVersion: $version
          InstallerType: inno
          Scope: user
          UpgradeBehavior: install
          InstallModes:
          - interactive
          - silent
          - silentWithProgress
          ProductCode: '{8F3A6C21-5D74-4E9B-A1C8-7B2E4F6D9013}_is1'
          Installers:
          - Architecture: x64
            InstallerUrl: $base/SwitchPlease-Setup.exe
            InstallerSha256: $(Hash 'SwitchPlease-Setup.exe')
          - Architecture: arm64
            InstallerUrl: $base/SwitchPlease-Setup-arm64.exe
            InstallerSha256: $(Hash 'SwitchPlease-Setup-arm64.exe')
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ | Set-Content "$manifests/Marrakesh.SwitchPlease.installer.yaml" -Encoding utf8

          Get-ChildItem $manifests | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }

      - name: Upload winget manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: artifacts/winget/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SwitchPlease-Setup.exe
            artifacts/SwitchPlease-Setup-arm64.exe
            artifacts/SwitchPlease.exe
            artifacts/SwitchPlease-runtime-required.exe
            artifacts/SwitchPlease-arm64.exe
            artifacts/SwitchPlease-arm64-runtime-required.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
