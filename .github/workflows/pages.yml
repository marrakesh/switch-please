name: Site

# Publishes https://marrakesh.github.io/switch-please/: the pages in site/, plus the
# demonstration drawings, which live in docs/ because the READMEs show them too. Copied in
# here rather than kept twice, so the site and the READMEs can never show different ones.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/demo.*.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. One already running is left to finish, so the site is never
# caught half-published; the newest push simply goes out after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/demo.*.svg _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
