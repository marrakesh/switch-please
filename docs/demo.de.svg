<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Switch Please fixes text typed in the wrong keyboard layout</title>
  <desc id="desc">A line reading "kurye Yeit" is typed, the hotkey is pressed, and it becomes "kurze Zeit".</desc>

  <!--
    The German demonstration. QWERTZ against the US layout swaps y and z, which is the
    signature of the mistake in this language, and the phrase is the one the welcome
    window uses, so the application and the README agree on what to show first.

    The animation is SMIL rather than CSS keyframes on purpose. GitHub serves this through an
    image proxy and renders it inside an <img>, where scripts never run and CSS support has
    historically been the flaky part; SMIL animation of plain attributes works there.

    Both phrases are set to an explicit textLength, so the clip rectangles that reveal them
    line up exactly regardless of which monospace face the viewer's machine actually has.
    10 characters at 20 px each, so the clips and the caret's travel are 200 and 240.
    Those three numbers have to move together: the clip reveals the text, and the caret has
    to stop exactly where the text ends.
  -->

  <defs>
    <clipPath id="typed-clip">
      <rect x="40" y="86" height="46" width="0">
        <animate attributeName="width"
                 values="0;200;200;0;0"
                 keyTimes="0;0.1667;0.3;0.3667;1"
                 dur="9s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="fixed-clip">
      <rect x="40" y="86" height="46" width="0">
        <animate attributeName="width"
                 values="0;0;200;200"
                 keyTimes="0;0.3667;0.5333;1"
                 dur="9s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="720" height="220" rx="14" fill="#14161a" />
  <rect x="0.5" y="0.5" width="719" height="219" rx="14" fill="none" stroke="#2b2f36" />

  <circle cx="30" cy="28" r="6" fill="#ff5f57" />
  <circle cx="52" cy="28" r="6" fill="#febc2e" />
  <circle cx="74" cy="28" r="6" fill="#28c840" />
  <text x="100" y="33" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" fill="#6b7280">Switch Please</text>

  <!-- The wrong-layout line, revealed left to right as though it were being typed. -->
  <g clip-path="url(#typed-clip)">
    <text x="40" y="120" textLength="200" lengthAdjust="spacing"
          font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace"
          font-size="32" fill="#d7dae0">kurye Yeit</text>
  </g>

  <!-- The same keys read in the other layout. -->
  <g clip-path="url(#fixed-clip)">
    <text x="40" y="120" textLength="200" lengthAdjust="spacing"
          font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace"
          font-size="32" fill="#7ee787">kurze Zeit</text>
  </g>

  <!-- The caret: follows the text out, back, and out again. -->
  <rect y="92" width="13" height="36" fill="#ffd54f" x="40">
    <animate attributeName="x"
             values="40;240;240;40;240;240"
             keyTimes="0;0.1667;0.3;0.3667;0.5333;1"
             dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity"
             values="1;1;0.15;1"
             keyTimes="0;0.4;0.7;1"
             dur="1.1s" repeatCount="indefinite" />
  </rect>

  <!-- The hotkey, shown at the moment it does its work. -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.29;0.32;0.53;0.58;1"
             dur="9s" repeatCount="indefinite" />
    <rect x="40" y="158" width="118" height="34" rx="8" fill="#1f2937" stroke="#3b4250" />
    <text x="99" y="180" text-anchor="middle"
          font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="15" fill="#e6e6e6">Shift ×2</text>
  </g>
</svg>
